# Cargo workspace: one repository, several crates (Rust packages) built together.
# See ROADMAP.md for why there are only two crates and when we add more.
[workspace]
resolver = "3"
members = ["crates/physics", "crates/app"]

# Settings shared by every crate (they opt in with `edition.workspace = true`, ...).
[workspace.package]
edition = "2024"
license = "EPL-2.0"
publish = false

# Dependency versions are declared once here, crates refer to them by name.
[workspace.dependencies]
physics = { path = "crates/physics" }
# 2D/3D vector maths (f64 types like DVec2 for physics).
glam = "0.34"
# Window, input and rendering (2D now, 3D + glTF models later), on wgpu.
# Pre-1.0 with breaking releases every few months: upgrade deliberately.
# See ROADMAP.md "Graphics" for why this library.
kiss3d = "0.47"

# Dependencies (wgpu, image decoding...) are slow when unoptimised; compile
# them with optimisations even in debug builds. Our own code stays
# unoptimised so it compiles fast and is easy to debug.
[profile.dev.package."*"]
opt-level = 2
