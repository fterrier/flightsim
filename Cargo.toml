# Cargo workspace: one repository, several crates (Rust packages) built together.
# See ROADMAP.md "Architecture" for what each crate is (engine vs game).
[workspace]
resolver = "3"
members = [
    "crates/physics",
    "crates/engine",
    "crates/engine_kiss3d",
    "crates/flightsim",
]

# Settings shared by every crate (they opt in with `edition.workspace = true`, ...).
[workspace.package]
edition = "2024"
license = "EPL-2.0"
publish = false

# Dependency versions are declared once here, crates refer to them by name.
[workspace.dependencies]
physics = { path = "crates/physics" }
engine = { path = "crates/engine" }
engine_kiss3d = { path = "crates/engine_kiss3d" }
# 2D/3D vector maths (f64 types like DVec2 for physics).
glam = "0.34"
# Window, input and rendering (2D now, 3D + glTF models later), on wgpu.
# Pre-1.0 with breaking releases every few months: upgrade deliberately.
# See ROADMAP.md "Graphics" for why this library.
kiss3d = "0.47"

# Lints for every crate (each opts in with `[lints] workspace = true`).
# `unreachable_pub`: an item marked `pub` that other crates can't reach
# must say `pub(crate)` instead, so every `pub` you read is real public
# API. (Allowed by default in rustc only because so much existing code
# would trigger it; the Rust team intends to make it warn by default.)
[workspace.lints.rust]
unreachable_pub = "warn"

# Dependencies (wgpu, image decoding...) are slow when unoptimised; compile
# them with optimisations even in debug builds. Our own code stays
# unoptimised so it compiles fast and is easy to debug.
[profile.dev.package."*"]
opt-level = 2
