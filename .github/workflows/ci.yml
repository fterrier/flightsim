# Runs on every push and pull request. Exactly the three commands you can run
# locally (see README "Develop"), so a green local run means a green CI run.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # Caches compiled dependencies between runs.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Games use the engine's game API only, never its platform API
      # (see AGENTS.md "Engine vs game").
      - name: game does not use engine::platform
        run: "! grep -rn 'engine::platform' crates/flightsim"

  # Line coverage must stay >= 95% (see AGENTS.md). The engine_kiss3d crate
  # and flightsim's main.rs need a window and GPU; they must contain no
  # logic ("humble objects"), so they are excluded.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --fail-under-lines 95 --ignore-filename-regex 'crates/(engine_kiss3d/|flightsim/src/main\.rs)'
